[package]
name = "the-model"
version = "0.1.0"
description = "THE MODEL — a performed keynote"
authors = ["THE MODEL"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "the_model_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
