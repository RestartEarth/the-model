<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapters — The Model</title>
    <style>
      :root {
        color-scheme: dark;
        --field: #191d26;
        --type: #f1f5fe;
        --muted: #8b97a8;
        --line: #2a3140;
        --focus: #5ba8ff;
        --warn: #e8a04a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--field);
        color: var(--type);
        font: 16px/1.45 ui-sans-serif, system-ui, sans-serif;
      }

      main {
        max-width: 46rem;
        margin: 0 auto;
        padding: 2.75rem 1.5rem 4rem;
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 560;
        letter-spacing: 0.01em;
      }

      .lead {
        margin: 0.4rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      ol {
        list-style: none;
        margin: 1.75rem 0 0;
        padding: 0;
      }

      li { border-top: 1px solid var(--line); }
      li:last-child { border-bottom: 1px solid var(--line); }

      a {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 1.5rem;
        row-gap: 0.15rem;
        padding: 0.85rem 0.15rem;
        color: inherit;
        text-decoration: none;
        align-items: baseline;
      }

      a:hover .name,
      a:focus-visible .name { color: var(--focus); }

      a:focus-visible {
        outline: 1px solid var(--focus);
        outline-offset: 2px;
      }

      .name { font-size: 1.05rem; }
      .slug { grid-column: 1; color: var(--muted); font-size: 0.85rem; }

      time {
        grid-row: 1 / span 2;
        grid-column: 2;
        color: var(--muted);
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
        text-align: right;
        white-space: nowrap;
      }

      .local {
        display: block;
        margin-top: 0.15rem;
        color: var(--warn);
        font-size: 0.75rem;
        letter-spacing: 0.02em;
      }

      @media (max-width: 640px) {
        a { grid-template-columns: 1fr; }
        time {
          grid-row: auto;
          grid-column: 1;
          text-align: left;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chapters</h1>
      <p class="lead">
        Open a chapter, record the hold, then come back. The time is when that chapter’s beats last changed.
      </p>
      <ol>
        <!--CHAPTER_ROWS-->
      </ol>
    </main>
  </body>
</html>
